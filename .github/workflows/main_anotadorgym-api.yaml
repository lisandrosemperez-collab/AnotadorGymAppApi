name: Build And Deploy API to Azure

on:
  push:
    branches: [ "main" ]  

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anotadorapi
  WEBAPP_NAME: anotadorgym-api

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:      
      contents: read
      id-token: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
    
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test --no-build --configuration Release
        
      - name: Azure Login
        uses: Azure/login@v3
        with:
            client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
            tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
            subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}  
      
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin
      
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            -f src/AnotadorGymApp.Api/Dockerfile \
            .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v2
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        
    
